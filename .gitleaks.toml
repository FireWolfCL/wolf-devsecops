# Config de gitleaks para el gate `secret-scan` del CI.
# Extiende las reglas por defecto y añade una allowlist acotada.
title = "gitleaks — Wolf DevSecOps"

[extend]
useDefault = true

[allowlist]
description = "Fixtures de test, placeholders de ejemplo y credenciales default de bootstrap: no son secretos reales."
paths = [
  '''backend/tests/.*''',          # contraseñas de PRUEBA en fixtures (p. ej. 'enrol-pass-123')
  '''.*\.example\.ya?ml''',        # manifiestos de ejemplo con placeholders (CAMBIAME-...)
]
regexes = [
  '''CAMBIAME''',                  # placeholder explícito en archivos .example
  '''admin:admin''',               # credencial DEFAULT de bootstrap (Harbor recién instalado; se cambia en el setup)
]
