[project]
name = "wolf-devsecops"
version = "0.1.0"
description = "Wolf DevSecOps — consola agregadora de seguridad de código (Community, Apache-2.0)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Wolf Industries" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.2",
    "typer>=0.15.1",
    # Persistencia (ADR-012): SQLAlchemy async + Alembic. BD solo para
    # identidad/config/auditoría — NUNCA resultados de escaneo (ADR-001).
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    # Primitivas de auth (A1, ADR-013): argon2id (passlib + argon2-cffi), JWT de
    # sesión (PyJWT), TOTP (pyotp), cifrado del secreto MFA en reposo
    # (cryptography/Fernet) y QR SVG del enrolamiento MFA (qrcode, sin PIL).
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.10.0",
    "pyotp>=2.9.0",
    "qrcode>=7.4.2",
    "cryptography>=43.0.0",
    # Login por formulario OAuth2 (A2): FastAPI requiere python-multipart para
    # parsear `application/x-www-form-urlencoded` en POST /auth/login.
    "python-multipart>=0.0.18",
    "reportlab>=4.2.0",
    # SSO/LDAP/AD (feature Pro, E2): ldap3 puro-Python (sin deps de sistema, encaja con
    # el deploy slim autohospedado). Pineado por el gotcha de timeouts int de 2.9.1.
    "ldap3==2.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff==0.17.3",
]
# Motor Postgres opcional (ADR-012): activar con
# WOLF_DATABASE_URL=postgresql+asyncpg://...  (por defecto se usa SQLite).
postgres = ["asyncpg>=0.30.0"]

[project.scripts]
wolf-devsecops = "wolf_devsecops.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wolf_devsecops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S"]
# B008: `Depends()`/`Query()` en defaults es EL patrón idiomático de FastAPI.
# UP042: `(str, Enum)` es intencional (serialización JSON estable, no StrEnum).
# UP046: `Generic[T]` tipado explícito en SourceResult es deliberado.
# E501: el largo de línea lo gobierna el formateador; no se lintea (recomendación Ruff).
ignore = ["S101", "B008", "UP042", "UP046", "E501"]

[tool.ruff.lint.per-file-ignores]
# En tests toleramos líneas largas (asserts) y usos típicos de fixtures.
"tests/**" = ["S", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
