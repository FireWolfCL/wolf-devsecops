# Config de git-cliff — changelog desde Conventional Commits.
[changelog]
header = "# Changelog\n\nTodas las versiones notables de Wolf DevSecOps.\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
## {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^sec", group = "Seguridad" },
  { message = "^docs", group = "Documentación" },
  { message = "^refactor", group = "Refactors" },
  { message = "^test", group = "Tests" },
  { message = "^perf", group = "Rendimiento" },
  { message = "^chore", skip = true },
]
tag_pattern = "v[0-9]*"
