# Wolf DevSecOps — Nginx del frontend: sirve el SPA y proxya el API al backend.
server {
  listen 8080;              # puerto no privilegiado: la imagen corre como uid 101 (no root)
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cuerpo de subidas razonable (reportes Trivy/SBOM si se suben desde el panel).
  client_max_body_size 25m;

  # API: mismo origen para el navegador; se reenvía al backend FastAPI tal cual.
  # Usamos el DNS embebido de Docker (127.0.0.11) + variable en proxy_pass para
  # RE-RESOLVER en cada request: así sobrevive a que el backend se recree con otra
  # IP (p. ej. tras provision-sources.sh) sin devolver 502. Con host:port sin ruta,
  # Nginx reenvía la URI original completa (se preserva el prefijo /api).
  location /api/ {
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $wolf_backend backend;
    proxy_pass http://$wolf_backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Generoso: el reviewer IA local (modelo en CPU) puede tardar >60s con prompts
    # grandes. Un endpoint hosted/GPU responde en segundos; esto no lo afecta.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  # Fallback SPA: /login, /admin/* y demás rutas de react-router caen en index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Activos con hash de Vite: cacheables de forma agresiva.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
