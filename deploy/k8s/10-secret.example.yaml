# =============================================================================
# PLANTILLA de secretos. NO comitear valores reales: genera el Secret real con
#   kubectl -n wolf-devsecops create secret generic wolf-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(python -c 'import secrets;print(secrets.token_urlsafe(18))')" \
#     --from-literal=WOLF_JWT_SECRET="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')" \
#     --from-literal=WOLF_MFA_FERNET_KEY="$(python -c 'from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())')" \
#     --from-literal=WOLF_ADMIN_PASSWORD="$(python -c 'import secrets;print(secrets.token_urlsafe(15))')"
# (y guarda el WOLF_ADMIN_PASSWORD que imprimas para el primer login).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: wolf-secrets
  namespace: wolf-devsecops
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CAMBIAME"
  WOLF_JWT_SECRET: "CAMBIAME-min-32-chars-alta-entropia"
  WOLF_MFA_FERNET_KEY: "CAMBIAME-Fernet-base64-32-bytes="
  WOLF_ADMIN_PASSWORD: "CAMBIAME"
