# Secretos en el historial git → DefectDojo (categoría "secrets" en el panel).
# Copia este archivo a .github/workflows/ en TU repo. Define los secrets
# DEFECTDOJO_URL y DEFECTDOJO_TOKEN y la variable DEFECTDOJO_PRODUCT.
name: secrets (gitleaks) → DefectDojo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0   # historial completo: gitleaks revisa TODOS los commits
      - name: gitleaks detect
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --report-format json \
            --report-path /repo/gitleaks.json --redact --exit-code 0
      - name: Subir a DefectDojo (si está configurado)
        env:
          DD_URL: ${{ secrets.DEFECTDOJO_URL }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          DD_PRODUCT: ${{ vars.DEFECTDOJO_PRODUCT }}
        run: |
          [ -n "$DD_URL" ] && [ -n "$DD_TOKEN" ] || { echo "DefectDojo no configurado; omito subida."; exit 0; }
          curl -sS -X POST "$DD_URL/api/v2/reimport-scan/" \
            -H "Authorization: Token $DD_TOKEN" \
            -F "scan_type=Gitleaks Scan" \
            -F "file=@gitleaks.json" \
            -F "product_name=$DD_PRODUCT" \
            -F "engagement_name=CI" -F "auto_create_context=true" \
            -F "active=true" -F "verified=false" \
            -F "close_old_findings=true" -F "do_not_reactivate=false"
